[project]
name = "vorstellungsgesprach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "elianezanlorense", email = "58109901+elianezanlorense@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "gitsource>=0.0.5",
    "google-genai>=2.18.1",
    "hf>=1.27.0",
    "huggingface-hub>=1.27.0",
    "language-tool-python>=3.4.0",
    "lingua-language-detector>=2.2.0",
    "load-dotenv>=0.1.0",
    "minisearch>=1.0.1",
    "onnxruntime>=1.28.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "tokenizers>=0.22.0,<=0.23.0",
]

[project.scripts]
vorstellungsgesprach = "vorstellungsgesprach:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.2",
]
